name: Publish CV

on:
  push:
    branches: [main]
    paths:
      - "resume.json"
      - "build/**"
      - "scripts/**"
      - "requirements.txt"
      - "Makefile"
      - ".python-version"
      - ".github/workflows/publish-cv.yml"
  workflow_dispatch:

concurrency:
  group: publish-cv
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout resume repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Build PDF
        run: make pdf

      - name: Check PDF output
        run: test -s output/resume.pdf

      - name: Checkout site repo
        uses: actions/checkout@v4
        with:
          repository: RrylandD/personal-website-astro
          token: ${{ secrets.SITE_DEPLOY_TOKEN }}
          path: site

      - name: Copy artifacts into site public/
        run: |
          set -euo pipefail
          mkdir -p site/public
          cp output/resume.pdf site/public/resume.pdf
          cp resume.json site/public/resume.json

      - name: Commit and push if changed
        working-directory: site
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/resume.pdf public/resume.json
          if git diff --staged --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "chore: publish CV from ryland-json-resume@${SOURCE_SHA}"
          git push
